name: CD

on:
  push:
    branches: [main]

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build-assets:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build/
          retention-days: 1

  deploy-argos01:
    needs: build-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-argos01

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: build-artifacts/

      - name: Upload assets to argos01
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ARGOS01_HOST }}
          username: franken
          key: ${{ secrets.DEPLOY_SSH_KEY_ARGOS }}
          port: ${{ secrets.ARGOS01_PORT }}
          source: "build-artifacts/*"
          target: "/home/franken/web/unblock.castris.com/public/build/"
          strip_components: 1

      - name: Deploy to argos01 (primary)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ARGOS01_HOST }}
          username: franken
          key: ${{ secrets.DEPLOY_SSH_KEY_ARGOS }}
          port: ${{ secrets.ARGOS01_PORT }}
          script: |
            cd /home/franken/web/unblock.castris.com

            echo ">>> Git pull"
            git pull origin main

            echo ">>> Composer install"
            composer install --no-dev --no-interaction --optimize-autoloader --no-scripts
            frankenphp php-cli artisan package:discover --ansi

            echo ">>> Run migrations"
            frankenphp php-cli artisan migrate --force

            echo ">>> Publish Filament assets"
            frankenphp php-cli artisan filament:assets

            echo ">>> Clear and rebuild caches"
            frankenphp php-cli artisan config:cache
            frankenphp php-cli artisan route:cache
            frankenphp php-cli artisan view:cache
            frankenphp php-cli artisan event:cache

            echo ">>> Deploy complete"

      - name: Health check argos01
        run: |
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' https://unblock.castris.com/admin/login || true)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed: HTTP $STATUS"

  deploy-argos02:
    needs: build-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-argos02

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: build-artifacts/

      - name: Upload assets to argos02
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ARGOS02_HOST }}
          username: franken
          key: ${{ secrets.DEPLOY_SSH_KEY_ARGOS }}
          port: ${{ secrets.ARGOS02_PORT }}
          source: "build-artifacts/*"
          target: "/home/franken/web/unblock.castris.com/public/build/"
          strip_components: 1

      - name: Deploy to argos02 (standby)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ARGOS02_HOST }}
          username: franken
          key: ${{ secrets.DEPLOY_SSH_KEY_ARGOS }}
          port: ${{ secrets.ARGOS02_PORT }}
          script: |
            cd /home/franken/web/unblock.castris.com

            echo ">>> Git pull"
            git pull origin main

            echo ">>> Composer install"
            composer install --no-dev --no-interaction --optimize-autoloader --no-scripts
            frankenphp php-cli artisan package:discover --ansi

            echo ">>> Run migrations"
            frankenphp php-cli artisan migrate --force

            echo ">>> Publish Filament assets"
            frankenphp php-cli artisan filament:assets

            echo ">>> Clear and rebuild caches"
            frankenphp php-cli artisan config:cache
            frankenphp php-cli artisan route:cache
            frankenphp php-cli artisan view:cache
            frankenphp php-cli artisan event:cache

            echo ">>> Deploy complete"

  deploy-amazzal:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-amazzal

    steps:
      - name: Deploy to amazzal (unblock.castris.com legacy)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AMAZZAL_HOST }}
          username: laravel
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.AMAZZAL_PORT }}
          script: |
            cd /home/laravel/domains/unblock.castris.com/unblock

            echo ">>> Git pull"
            git pull origin main

            echo ">>> Composer install"
            composer install --no-dev --no-interaction --optimize-autoloader

            echo ">>> Load nvm and build assets"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            npm ci
            npm run build

            echo ">>> Run migrations"
            php artisan migrate --force

            echo ">>> Clear and rebuild caches"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo ">>> Restart queue workers"
            php artisan queue:restart

            echo ">>> Deploy complete"

      - name: Health check amazzal
        run: |
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' https://unblock.castris.com/admin/login || true)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed: HTTP $STATUS"

  deploy-central:
    needs: deploy-amazzal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-central

    steps:
      - name: Deploy to central (desbloquear.xerintel.es)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CENTRAL_HOST }}
          username: unblock
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.CENTRAL_PORT }}
          script: |
            cd /home/unblock/unblock

            echo ">>> Git pull"
            git pull origin main

            echo ">>> Composer install"
            composer install --no-dev --no-interaction --optimize-autoloader

            echo ">>> Build assets"
            npm ci
            npm run build

            echo ">>> Run migrations"
            php artisan migrate --force

            echo ">>> Clear and rebuild caches"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo ">>> Restart queue workers"
            php artisan queue:restart

            echo ">>> Deploy complete"

      - name: Health check central
        run: |
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' https://desbloquear.xerintel.es/admin/login || true)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed: HTTP $STATUS"
