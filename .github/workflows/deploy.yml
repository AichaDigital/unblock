name: CD

on:
  push:
    branches: [main]

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build-assets:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vite-build
          path: public/build/
          retention-days: 1

  deploy-argos01:
    needs: build-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-argos01

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vite-build
          path: build-artifacts/

      - name: Upload assets to argos01
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.ARGOS01_HOST }}
          username: ${{ vars.DEPLOY_USER_ARGOS }}
          key: ${{ secrets.DEPLOY_SSH_KEY_ARGOS }}
          port: ${{ secrets.ARGOS01_PORT }}
          source: "build-artifacts/*"
          target: "${{ vars.DEPLOY_PATH_ARGOS }}/public/build/"
          strip_components: 1

      - name: Deploy to argos01 (primary)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.ARGOS01_HOST }}
          username: ${{ vars.DEPLOY_USER_ARGOS }}
          key: ${{ secrets.DEPLOY_SSH_KEY_ARGOS }}
          port: ${{ secrets.ARGOS01_PORT }}
          script: |
            cd ${{ vars.DEPLOY_PATH_ARGOS }}
            git pull origin main
            bash deploy/deploy.sh "frankenphp php-cli" "."

      - name: Health check argos01
        run: |
          sleep 5
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' https://unblock.castris.com/admin/login || true)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed: HTTP $STATUS"

  deploy-argos02:
    needs: build-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-argos02

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vite-build
          path: build-artifacts/

      - name: Upload assets to argos02
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.ARGOS02_HOST }}
          username: ${{ vars.DEPLOY_USER_ARGOS }}
          key: ${{ secrets.DEPLOY_SSH_KEY_ARGOS }}
          port: ${{ secrets.ARGOS02_PORT }}
          source: "build-artifacts/*"
          target: "${{ vars.DEPLOY_PATH_ARGOS }}/public/build/"
          strip_components: 1

      - name: Deploy to argos02 (standby)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.ARGOS02_HOST }}
          username: ${{ vars.DEPLOY_USER_ARGOS }}
          key: ${{ secrets.DEPLOY_SSH_KEY_ARGOS }}
          port: ${{ secrets.ARGOS02_PORT }}
          script: |
            cd ${{ vars.DEPLOY_PATH_ARGOS }}
            git pull origin main
            bash deploy/deploy.sh "frankenphp php-cli" "."
